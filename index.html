<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Еволюція моделей атома (AR)</title>
    
    <!-- Підключення бібліотек -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
    
    <!-- Скрипт масштабування -->
    <script>
      AFRAME.registerComponent('pinch-scale', {
        schema: {
          min: {type: 'number', default: 0.2},
          max: {type: 'number', default: 3.5}
        },
        init: function () {
          let initialDistance = 0;
          let initialScale = { x: 1, y: 1, z: 1 };
          
          window.addEventListener('touchstart', (e) => {
            const marker = this.el.closest('a-marker');
            if (!marker || !marker.object3D || !marker.object3D.visible) return;
            
            if (e.touches.length === 2) {
              initialDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
              initialScale = Object.assign({}, this.el.getAttribute('scale'));
            }
          });

          window.addEventListener('touchmove', (e) => {
            const marker = this.el.closest('a-marker');
            if (!marker || !marker.object3D || !marker.object3D.visible) return;
            
            if (e.touches.length === 2 && initialDistance > 0) {
              const factor = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY) / initialDistance;
              this.el.setAttribute('scale', {
                x: Math.min(Math.max(initialScale.x * factor, this.data.min), this.data.max),
                y: Math.min(Math.max(initialScale.y * factor, this.data.min), this.data.max),
                z: Math.min(Math.max(initialScale.z * factor, this.data.min), this.data.max)
              });
            }
          });

          window.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) initialDistance = 0;
          });

          window.addEventListener('wheel', (e) => {
            const marker = this.el.closest('a-marker');
            if (!marker || !marker.object3D || !marker.object3D.visible) return;
            
            const scale = this.el.getAttribute('scale');
            const factor = e.deltaY < 0 ? 1.1 : 0.9;
            this.el.setAttribute('scale', {
              x: Math.min(Math.max(scale.x * factor, this.data.min), this.data.max),
              y: Math.min(Math.max(scale.y * factor, this.data.min), this.data.max),
              z: Math.min(Math.max(scale.z * factor, this.data.min), this.data.max)
            });
          });
        }
      });
    </script>
    
    <!-- Скрипт розумного обертання -->
    <script>
      AFRAME.registerComponent('smart-rotate', {
        schema: {
          speed: {type: 'number', default: 0.25},
          delay: {type: 'number', default: 1500},
          returnSpeed: {type: 'number', default: 0.05},
          autoRotate: {type: 'boolean', default: true}
        },
        init: function () {
          this.isInteracting = false;
          this.isReturning = false;
          this.resumeTimer = null;
          this.previousX = 0;
          this.previousY = 0;
          this.previousAngle = null;

          const startInteraction = () => {
            this.isInteracting = true;
            this.isReturning = false;
            clearTimeout(this.resumeTimer);
          };

          const stopInteraction = () => {
            this.resumeTimer = setTimeout(() => {
              this.isInteracting = false;
              this.isReturning = true;
            }, this.data.delay);
          };

          window.addEventListener('touchstart', (e) => {
            const marker = this.el.closest('a-marker');
            if (!marker || !marker.object3D || !marker.object3D.visible) return;
            
            startInteraction();
            if (e.touches.length === 1) {
              this.previousX = e.touches[0].clientX;
              this.previousY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
              this.previousAngle = Math.atan2(e.touches[1].clientY - e.touches[0].clientY, e.touches[1].clientX - e.touches[0].clientX);
            }
          });

          window.addEventListener('touchmove', (e) => {
            if (!this.isInteracting) return;
            const marker = this.el.closest('a-marker');
            if (!marker || !marker.object3D || !marker.object3D.visible) return;
            
            const rotation = this.el.getAttribute('rotation');

            if (e.touches.length === 1) {
              const deltaX = e.touches[0].clientX - this.previousX;
              const deltaY = e.touches[0].clientY - this.previousY;
              this.el.setAttribute('rotation', {
                x: rotation.x + deltaY * 0.4,
                y: rotation.y + deltaX * 0.4,
                z: rotation.z
              });
              this.previousX = e.touches[0].clientX;
              this.previousY = e.touches[0].clientY;
            } else if (e.touches.length === 2 && this.previousAngle !== null) {
              const currentAngle = Math.atan2(e.touches[1].clientY - e.touches[0].clientY, e.touches[1].clientX - e.touches[0].clientX);
              let deltaZ = (currentAngle - this.previousAngle) * (180 / Math.PI);
              if (deltaZ > 180) deltaZ -= 360;
              if (deltaZ < -180) deltaZ += 360;
              this.el.setAttribute('rotation', { x: rotation.x, y: rotation.y, z: rotation.z - deltaZ });
              this.previousAngle = currentAngle;
            }
          });

          window.addEventListener('touchend', (e) => {
            const marker = this.el.closest('a-marker');
            if (!marker || !marker.object3D || !marker.object3D.visible) return;
            
            if (e.touches.length === 0) { stopInteraction(); this.previousAngle = null; }
            else if (e.touches.length === 1) { this.previousX = e.touches[0].clientX; this.previousY = e.touches[0].clientY; this.previousAngle = null; }
          });

          // Для мишки (тестування на ПК)
          window.addEventListener('mousedown', (e) => { 
            const marker = this.el.closest('a-marker');
            if (!marker || !marker.object3D || !marker.object3D.visible) return;
            startInteraction(); this.previousX = e.clientX; this.previousY = e.clientY; 
          });
          window.addEventListener('mousemove', (e) => {
            if (!this.isInteracting || e.buttons !== 1) return;
            const marker = this.el.closest('a-marker');
            if (!marker || !marker.object3D || !marker.object3D.visible) return;
            
            const rotation = this.el.getAttribute('rotation');
            if (e.shiftKey) { this.el.setAttribute('rotation', { x: rotation.x, y: rotation.y, z: rotation.z - (e.clientX - this.previousX) * 0.4 }); } 
            else { this.el.setAttribute('rotation', { x: rotation.x + (e.clientY - this.previousY) * 0.4, y: rotation.y + (e.clientX - this.previousX) * 0.4, z: rotation.z }); }
            this.previousX = e.clientX; this.previousY = e.clientY;
          });
          window.addEventListener('mouseup', () => { 
            const marker = this.el.closest('a-marker');
            if (marker && marker.object3D && marker.object3D.visible) stopInteraction(); 
          });
        },
        
        tick: function (time, timeDelta) {
          const marker = this.el.closest('a-marker');
          if (!marker || !marker.object3D || !marker.object3D.visible) return;
          if (this.isInteracting || !this.data.autoRotate) return;

          const rotation = this.el.getAttribute('rotation');
          const delta = timeDelta > 100 ? 16 : timeDelta; 
          
          let currentX = rotation.x % 360; if (currentX > 180) currentX -= 360; if (currentX < -180) currentX += 360;
          let currentZ = rotation.z % 360; if (currentZ > 180) currentZ -= 360; if (currentZ < -180) currentZ += 360;

          if (this.isReturning) {
            const lerpFactor = this.data.returnSpeed * (delta / 16.6);
            currentX -= currentX * lerpFactor;
            currentZ -= currentZ * lerpFactor;
            if (Math.abs(currentX) < 0.5 && Math.abs(currentZ) < 0.5) { currentX = 0; currentZ = 0; this.isReturning = false; }
          }
          
          this.el.setAttribute('rotation', { x: currentX, y: rotation.y + (this.data.speed * delta / 16.6), z: currentZ });
        }
      });
    </script>
  </head>

              <a-sphere position="-0.35 0 0" radius="0.18" scale="1.6 1 1" color="#FF00FF" material="blending: additive; opacity: 0.15; transparent: true"></a-sphere>
            </a-entity>
            <a-entity animation="property: scale; to: 1 1.1 1; dir: alternate; dur: 1400; loop: true">
              <a-sphere position="0 0.35 0" radius="0.18" scale="1 1.6 1" color="#AA00FF" material="blending: additive; opacity: 0.15; transparent: true"></a-sphere>
              <a-sphere position="0 -0.35 0" radius="0.18" scale="1 1.6 1" color="#AA00FF" material="blending: additive; opacity: 0.15; transparent: true"></a-sphere>

          <a-entity>
            <a-sphere radius="0.015" color="#FFFFFF" material="blending: additive" animation="property: position; from: 0.2 0.3 0.1; to: -0.3 -0.2 -0.4; dir: alternate; dur: 400; loop: true; easing: easeInOutElastic"></a-sphere>
            <a-sphere radius="0.015" color="#FFFFFF" material="blending: additive" animation="property: position; from: -0.4 0.1 -0.2; to: 0.1 -0.5 0.3; dir: alternate; dur: 550; loop: true; easing: easeInOutElastic"></a-sphere>
            <a-sphere radius="0.015" color="#FFFFFF" material="blending: additive" animation="property: position; from: 0.1 -0.1 0.5; to: -0.2 0.4 -0.1; dir: alternate; dur: 450; loop: true; easing: easeInOutElastic"></a-sphere>
