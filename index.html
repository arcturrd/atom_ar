<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Модель атома Джона Дальтона (AR)</title>
    <!-- Стабільна зв'язка бібліотек через надійний CDN jsDelivr -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; patternRatio: 0.50;">
      
      <!-- Шлях до вашого файлу маркера -->
      <a-marker type="pattern" url="./pattern-dalton.patt.txt">
        
        <!-- 3D-модель атома Дальтона -->
        <a-sphere position="0 0.5 0" radius="0.6" color="#A0522D" roughness="0.8"></a-sphere>
        
        <!-- Підпис над моделлю -->
        <a-text value="John Dalton (1803)" position="-0.8 1.2 0" color="#FFFFFF" rotation="-90 0 0" scale="0.8 0.8 0.8"></a-text>
        
      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
