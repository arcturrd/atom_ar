<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Моделі атомів (AR)</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; patternRatio: 0.90;">
      
      <!-- ========================================== -->
      <!-- 1. МОДЕЛЬ ДАЛЬТОНА (1803)                  -->
      <!-- ========================================== -->
      <a-marker type="pattern" url="./pattern-dalton.patt">
        <a-sphere position="0 0.5 0" radius="0.6" color="#A0522D" roughness="0.8"></a-sphere>
        <a-text value="John Dalton (1803)" position="-0.8 1.2 0" color="#FFFFFF" rotation="-90 0 0" scale="0.8 0.8 0.8"></a-text>
      </a-marker>

      <!-- ========================================== -->
      <!-- 2. МОДЕЛЬ ТОМСОНА (1904)                   -->
      <!-- ========================================== -->
      <a-marker type="pattern" url="./pattern-thomson.patt">
        <a-sphere position="0 0.6 0" radius="0.7" color="#D2691E" opacity="0.6" transparent="true"></a-sphere>
        <a-entity position="0 0.6 0">
          <a-sphere radius="0.1" color="#1E90FF" position="0.3 0.2 0.3" animation="property: position; to: 0.4 0.3 0.4; dir: alternate; dur: 1500; loop: true"></a-sphere>
          <a-sphere radius="0.1" color="#1E90FF" position="-0.4 -0.1 0.2" animation="property: position; to: -0.3 -0.2 0.1; dir: alternate; dur: 2000; loop: true"></a-sphere>
          <a-sphere radius="0.1" color="#1E90FF" position="0.1 -0.4 -0.3" animation="property: position; to: 0.2 -0.3 -0.2; dir: alternate; dur: 1800; loop: true"></a-sphere>
          <a-sphere radius="0.1" color="#1E90FF" position="-0.2 0.4 -0.4" animation="property: position; to: -0.1 0.3 -0.5; dir: alternate; dur: 1700; loop: true"></a-sphere>
        </a-entity>
        <a-text value="J.J. Thomson (1904)" position="-0.8 1.4 0" color="#FFFFFF" rotation="-90 0 0" scale="0.8 0.8 0.8"></a-text>
      </a-marker>

      <!-- ========================================== -->
      <!-- 3. МОДЕЛЬ РЕЗЕРФОРДА (1911)                -->
      <!-- ========================================== -->
      <a-marker type="pattern" url="./pattern-rutherford.patt">
        <a-entity position="0 0.6 0">
          <a-entity>
            <a-sphere position="0 0 0" radius="0.15" color="#FF4500"></a-sphere>
            <a-sphere position="0.05 0.05 0" radius="0.1" color="#DC143C"></a-sphere>
            <a-sphere position="-0.05 -0.05 0" radius="0.1" color="#DC143C"></a-sphere>
          </a-entity>
          <a-entity rotation="0 0 0">
            <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
              <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0" side="double"></a-ring>
              <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
            </a-entity>
          </a-entity>
          <a-entity rotation="60 0 0">
            <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
              <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0" side="double"></a-ring>
              <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
            </a-entity>
          </a-entity>
          <a-entity rotation="120 0 0">
            <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 3500; easing: linear">
              <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0" side="double"></a-ring>
              <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
            </a-entity>
          </a-entity>
        </a-entity>
        <a-text value="E. Rutherford (1911)" position="-0.8 1.4 0" color="#FFFFFF" rotation="-90 0 0" scale="0.8 0.8 0.8"></a-text>
      </a-marker>

      <!-- ========================================== -->
      <!-- 4. МОДЕЛЬ БОРА (1913)                      -->
      <!-- ========================================== -->
      <a-marker type="pattern" url="./pattern-bohr.patt">
        <!-- Контейнер моделі з нахилом 35 градусів, щоб добре бачити концентричні кільця -->
        <a-entity position="0 0.6 0" rotation="35 0 0">
          
          <!-- Ядро -->
          <a-entity>
            <a-sphere position="0 0 0" radius="0.12" color="#FF4500"></a-sphere>
            <a-sphere position="0.04 0.04 0" radius="0.08" color="#DC143C"></a-sphere>
            <a-sphere position="-0.04 -0.04 0" radius="0.08" color="#DC143C"></a-sphere>
          </a-entity>

          <!-- Орбіта 1 (n=1, K-рівень): 2 електрони -->
          <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 2500; easing: linear">
            <a-ring radius-inner="0.38" radius-outer="0.4" color="#FFFFFF" opacity="0.6" rotation="90 0 0" side="double"></a-ring>
            <a-sphere position="0.4 0 0" radius="0.06" color="#00FF00"></a-sphere>
            <a-sphere position="-0.4 0 0" radius="0.06" color="#00FF00"></a-sphere>
          </a-entity>

          <!-- Орбіта 2 (n=2, L-рівень): 4 електрони (спрощено) -->
          <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 4500; easing: linear">
            <a-ring radius-inner="0.68" radius-outer="0.7" color="#FFFFFF" opacity="0.6" rotation="90 0 0" side="double"></a-ring>
            <a-sphere position="0.7 0 0" radius="0.06" color="#00FF00"></a-sphere>
            <a-sphere position="-0.7 0 0" radius="0.06" color="#00FF00"></a-sphere>
            <a-sphere position="0 0 0.7" radius="0.06" color="#00FF00"></a-sphere>
            <a-sphere position="0 0 -0.7" radius="0.06" color="#00FF00"></a-sphere>
          </a-entity>

          <!-- Орбіта 3 (n=3, M-рівень): 2 електрони -->
          <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
            <a-ring radius-inner="0.98" radius-outer="1.0" color="#FFFFFF" opacity="0.6" rotation="90 0 0" side="double"></a-ring>
            <a-sphere position="1.0 0 0" radius="0.06" color="#00FF00"></a-sphere>
            <a-sphere position="-1.0 0 0" radius="0.06" color="#00FF00"></a-sphere>
          </a-entity>

          <!-- Анімація випромінювання фотона (квантовий перехід) -->
          <a-sphere radius="0.04" color="#FFD700"
                    animation="property: position; from: 0.7 0 0; to: 2 0 1.5; loop: true; dur: 2000"
                    animation__fade="property: opacity; from: 1; to: 0; loop: true; dur: 2000">
          </a-sphere>
          
        </a-entity>
        
        <!-- Підпис -->
        <a-text value="Niels Bohr (1913)" position="-0.8 1.5 -0.5" color="#FFFFFF" rotation="-90 0 0" scale="0.8 0.8 0.8"></a-text>
      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
