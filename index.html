<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Еволюція моделей атома (AR)</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
    
    <!-- Виправлений скрипт звуку: працює надійніше -->
    <script>
      AFRAME.registerComponent('soundhandler', {
        init: function () {
          this.soundEl = document.querySelector('#dalton-audio');
          this.el.addEventListener('markerFound', () => {
            if (this.soundEl) this.soundEl.play();
          });
          this.el.addEventListener('markerLost', () => {
            if (this.soundEl) this.soundEl.pause();
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <!-- Додано кнопку для ініціалізації звуку користувачем, щоб браузер не блокував його -->
    <div id="start-button" style="position: absolute; z-index: 1000; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px; background-color: #333; color: white; border-radius: 5px; cursor: pointer; font-family: sans-serif;">
      Увімкнути звук
    </div>

    <script>
      document.querySelector('#start-button').addEventListener('click', function() {
        var audio = document.querySelector('#dalton-audio');
        audio.play().then(() => {
          audio.pause(); // Готуємо звук
          this.style.display = 'none'; // Ховаємо кнопку
        }).catch(e => console.error(e));
      });
    </script>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; patternRatio: 0.90;">
      
      <!-- Завантаження аудіо -->
      <a-assets>
        <audio id="dalton-audio" src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_82c694a919.mp3" preload="auto" loop></audio>
      </a-assets>

      <!-- ========================================== -->
      <!-- 1. МАРКЕР ДАЛЬТОНА (Портрет) - Живий Щоденник -->
      <!-- ========================================== -->
      <a-marker type="pattern" url="./pattern-dalton.patt" soundhandler>
        
        <!-- Загальний контейнер (Текст прибрано) -->
        <a-entity position="0 0.5 0" scale="0.8 0.8 0.8">
          
          <!-- СТАРОВИННІ ТЕРЕЗИ -->
          <a-entity position="0 0.5 0">
            <a-cylinder position="0 -1.5 0" radius="0.4" height="0.1" color="#8B4513" roughness="0.9"></a-cylinder>
            <a-cylinder position="0 -0.5 0" radius="0.05" height="2" color="#B8860B" metalness="0.8" roughness="0.2"></a-cylinder>
            
            <a-entity animation="property: rotation; from: 0 0 -5; to: 0 0 5; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine">
              <a-cylinder position="0 0 0" radius="0.04" height="2.5" rotation="0 0 90" color="#B8860B" metalness="0.8"></a-cylinder>
              
              <!-- Ліва шалька -->
              <a-entity position="-1.2 -1 0">
                <a-cylinder position="0 0 0" radius="0.3" height="0.05" color="#DAA520" metalness="0.7"></a-cylinder>
                <a-cylinder position="0 0.5 0" radius="0.01" height="1" color="#DAA520"></a-cylinder>
                <a-sphere position="0 0.25 0" radius="0.2" color="#8B0000" roughness="0.9"></a-sphere>
              </a-entity>
              
              <!-- Права шалька -->
              <a-entity position="1.2 -1 0">
                <a-cylinder position="0 0 0" radius="0.3" height="0.05" color="#DAA520" metalness="0.7"></a-cylinder>
                <a-cylinder position="0 0.5 0" radius="0.01" height="1" color="#DAA520"></a-cylinder>
                <a-cylinder position="0.1 0.1 0" radius="0.08" height="0.15" color="#CD7F32" metalness="0.8"></a-cylinder>
                <a-cylinder position="-0.1 0.08 0" radius="0.06" height="0.1" color="#CD7F32" metalness="0.8"></a-cylinder>
              </a-entity>
            </a-entity>
          </a-entity>
          
          <a-plane position="0 -1.4 0" rotation="-90 0 0" width="3" height="3" color="#F5DEB3" material="opacity: 0.3; transparent: true"></a-plane>
        </a-entity>
      </a-marker>

      <!-- Новий спрощений маркер Дальтона (Збільшена в 2 рази) -->
      <a-marker type="pattern" url="./pattern-dalton-s.patt">
        <a-entity scale="3 3 3" position="0 1.5 0">
          <a-sphere position="0 0 0" radius="0.6" color="#A0522D" roughness="0.8"></a-sphere>
        </a-entity>
      </a-marker>

      <!-- ========================================== -->
      <!-- 2. МАРКЕР ТОМСОНА (Портрет) - Живий Щоденник -->
      <!-- ========================================== -->
      <a-marker type="pattern" url="./pattern-thomson.patt">
        
        <!-- Загальний контейнер -->
        <a-entity position="0 0.5 0" scale="0.8 0.8 0.8">
          
          <!-- ВІНТАЖНИЙ П'ЄДЕСТАЛ (Червоне дерево та мідь) -->
          <a-entity position="0 -0.5 0">
            <!-- Дерев'яна основа -->
            <a-cylinder position="0 -1 0" radius="0.6" height="0.1" color="#3e2723" roughness="0.9"></a-cylinder>
            <a-cylinder position="0 -0.9 0" radius="0.5" height="0.1" color="#4e342e" roughness="0.9"></a-cylinder>
            
            <!-- Мідна стійка -->
            <a-cylinder position="0 -0.4 0" radius="0.08" height="1.0" color="#b87333" metalness="0.8" roughness="0.3"></a-cylinder>
            
            <!-- Мідна чаша-тримач -->
            <a-cylinder position="0 0.1 0" radius="0.4" height="0.05" color="#b87333" metalness="0.8" roughness="0.3"></a-cylinder>
            <a-torus position="0 0.15 0" radius="0.38" radius-tubular="0.02" rotation="90 0 0" color="#b87333" metalness="0.8"></a-torus>
          </a-entity>

          <!-- АТОМ ТОМСОНА ("Пудинг з родзинками" на п'єдесталі) -->
          <!-- Сфера повільно обертається над підставкою -->
          <a-entity position="0 0.7 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear">
            
            <!-- Позитивна сфера (напівпрозоре оранжево-червоне "желе") -->
            <a-sphere radius="0.7" color="#ff4500" material="opacity: 0.35; transparent: true; side: double"></a-sphere>
            
            <!-- Внутрішнє світіння ядра (ілюзія об'єму) -->
            <a-sphere radius="0.45" color="#ff8c00" material="blending: additive; opacity: 0.5; transparent: true"></a-sphere>

            <!-- Електрони, які швидко вібрують всередині сфери -->
            <a-entity>
               <a-sphere radius="0.08" color="#00ffff" position="0.4 0.3 0.2" material="blending: additive" animation="property: position; to: 0.42 0.28 0.22; dir: alternate; dur: 300; loop: true"></a-sphere>
               <a-sphere radius="0.08" color="#00ffff" position="-0.4 0.1 0.4" material="blending: additive" animation="property: position; to: -0.38 0.12 0.42; dir: alternate; dur: 450; loop: true"></a-sphere>
               <a-sphere radius="0.08" color="#00ffff" position="0.1 -0.5 0.3" material="blending: additive" animation="property: position; to: 0.12 -0.48 0.28; dir: alternate; dur: 350; loop: true"></a-sphere>
               <a-sphere radius="0.08" color="#00ffff" position="-0.3 -0.3 -0.4" material="blending: additive" animation="property: position; to: -0.32 -0.28 -0.38; dir: alternate; dur: 400; loop: true"></a-sphere>
               <a-sphere radius="0.08" color="#00ffff" position="0.3 0.1 -0.5" material="blending: additive" animation="property: position; to: 0.28 0.12 -0.52; dir: alternate; dur: 320; loop: true"></a-sphere>
               <a-sphere radius="0.08" color="#00ffff" position="-0.2 0.4 -0.1" material="blending: additive" animation="property: position; to: -0.18 0.42 -0.08; dir: alternate; dur: 380; loop: true"></a-sphere>
               <a-sphere radius="0.08" color="#00ffff" position="0.0 0.0 0.5" material="blending: additive" animation="property: position; to: 0.02 -0.02 0.48; dir: alternate; dur: 420; loop: true"></a-sphere>
               <a-sphere radius="0.08" color="#00ffff" position="0.2 -0.2 0.4" material="blending: additive" animation="property: position; to: 0.22 -0.18 0.38; dir: alternate; dur: 390; loop: true"></a-sphere>
            </a-entity>
          </a-entity>

          <!-- Вінтажна підкладка (аркуш паперу) під об'єктом -->
          <a-plane position="0 -1.4 0" rotation="-90 0 0" width="3" height="3" color="#F5DEB3" material="opacity: 0.3; transparent: true"></a-plane>

        </a-entity>
      </a-marker>
      
      <!-- Новий маркер Томсона (Збільшена в 2 рази) -->
      <a-marker type="pattern" url="./pattern-thomson-new.patt">
        <a-entity scale="2 2 2" position="0 1.5 0">
          <a-entity animation="property: rotation; to: 0 360 360; loop: true; dur: 25000; easing: linear">
            <a-sphere radius="0.75" color="#FF4500" material="opacity: 0.25; transparent: true; side: double" animation="property: scale; to: 1.03 1.03 1.03; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine"></a-sphere>
            <a-sphere radius="0.55" color="#FF8C00" material="blending: additive; opacity: 0.4; transparent: true"></a-sphere>
            <a-entity>
              <a-sphere radius="0.06" color="#00FFFF" position="0.4 0.3 0.2" material="blending: additive" animation="property: position; to: 0.42 0.28 0.22; dir: alternate; dur: 800; loop: true"></a-sphere>
              <a-sphere radius="0.06" color="#00FFFF" position="-0.4 0.1 0.4" material="blending: additive" animation="property: position; to: -0.38 0.12 0.42; dir: alternate; dur: 950; loop: true"></a-sphere>
              <a-sphere radius="0.06" color="#00FFFF" position="0.1 -0.5 0.3" material="blending: additive" animation="property: position; to: 0.12 -0.48 0.28; dir: alternate; dur: 1100; loop: true"></a-sphere>
              <a-sphere radius="0.06" color="#00FFFF" position="-0.3 -0.3 -0.4" material="blending: additive" animation="property: position; to: -0.32 -0.28 -0.38; dir: alternate; dur: 850; loop: true"></a-sphere>
              <a-sphere radius="0.06" color="#00FFFF" position="0.3 0.1 -0.5" material="blending: additive" animation="property: position; to: 0.28 0.12 -0.52; dir: alternate; dur: 1050; loop: true"></a-sphere>
              <a-sphere radius="0.06" color="#00FFFF" position="-0.2 0.5 -0.1" material="blending: additive" animation="property: position; to: -0.18 0.52 -0.08; dir: alternate; dur: 900; loop: true"></a-sphere>
              <a-sphere radius="0.06" color="#00FFFF" position="0.0 0.0 0.6" material="blending: additive" animation="property: position; to: 0.02 -0.02 0.58; dir: alternate; dur: 1200; loop: true"></a-sphere>
              <a-sphere radius="0.06" color="#00FFFF" position="0.1 0.4 0.4" material="blending: additive" animation="property: position; to: 0.08 0.42 0.42; dir: alternate; dur: 1000; loop: true"></a-sphere>
              <a-sphere radius="0.06" color="#00FFFF" position="-0.5 -0.1 -0.2" material="blending: additive" animation="property: position; to: -0.48 -0.12 -0.22; dir: alternate; dur: 1150; loop: true"></a-sphere>
              <a-sphere radius="0.06" color="#00FFFF" position="-0.1 0.1 0.1" material="blending: additive" animation="property: position; to: -0.12 0.12 0.08; dir: alternate; dur: 700; loop: true"></a-sphere>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-marker>

      <!-- Спрощений маркер Томсона (Збільшена в 2 рази) -->
      <a-marker type="pattern" url="./pattern-thomson-s.patt">
        <a-entity scale="2 2 2" position="0 1.5 0">
          <a-entity animation="property: rotation; to: 0 360 360; loop: true; dur: 25000; easing: linear">
            <a-sphere radius="0.75" color="#FF4500" material="opacity: 0.25; transparent: true; side: double" animation="property: scale; to: 1.03 1.03 1.03; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine"></a-sphere>
            <a-sphere radius="0.55" color="#FF8C00" material="blending: additive; opacity: 0.4; transparent: true"></a-sphere>
            <a-entity>
              <a-sphere radius="0.06" color="#00FFFF" position="0.4 0.3 0.2" material="blending: additive" animation="property: position; to: 0.42 0.28 0.22; dir: alternate; dur: 800; loop: true"></a-sphere>
              <a-sphere radius="0.06" color="#00FFFF" position="-0.4 0.1 0.4" material="blending: additive" animation="property: position; to: -0.38 0.12 0.42; dir: alternate; dur: 950; loop: true"></a-sphere>
              <a-sphere radius="0.06" color="#00FFFF" position="0.1 -0.5 0.3" material="blending: additive" animation="property: position; to: 0.12 -0.48 0.28; dir: alternate; dur: 1100; loop: true"></a-sphere>
              <a-sphere radius="0.06" color="#00FFFF" position="-0.3 -0.3 -0.4" material="blending: additive" animation="property: position; to: -0.32 -0.28 -0.38; dir: alternate; dur: 850; loop: true"></a-sphere>
              <a-sphere radius="0.06" color="#00FFFF" position="0.3 0.1 -0.5" material="blending: additive" animation="property: position; to: 0.28 0.12 -0.52; dir: alternate; dur: 1050; loop: true"></a-sphere>
              <a-sphere radius="0.06" color="#00FFFF" position="-0.2 0.5 -0.1" material="blending: additive" animation="property: position; to: -0.18 0.52 -0.08; dir: alternate; dur: 900; loop: true"></a-sphere>
              <a-sphere radius="0.06" color="#00FFFF" position="0.0 0.0 0.6" material="blending: additive" animation="property: position; to: 0.02 -0.02 0.58; dir: alternate; dur: 1200; loop: true"></a-sphere>
              <a-sphere radius="0.06" color="#00FFFF" position="0.1 0.4 0.4" material="blending: additive" animation="property: position; to: 0.08 0.42 0.42; dir: alternate; dur: 1000; loop: true"></a-sphere>
              <a-sphere radius="0.06" color="#00FFFF" position="-0.5 -0.1 -0.2" material="blending: additive" animation="property: position; to: -0.48 -0.12 -0.22; dir: alternate; dur: 1150; loop: true"></a-sphere>
              <a-sphere radius="0.06" color="#00FFFF" position="-0.1 0.1 0.1" material="blending: additive" animation="property: position; to: -0.12 0.12 0.08; dir: alternate; dur: 700; loop: true"></a-sphere>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-marker>
      
      <!-- ========================================== -->
      <!-- 3. МАРКЕР РЕЗЕРФОРДА (Портрет) - Живий Щоденник -->
      <!-- ========================================== -->
      <a-marker type="pattern" url="./pattern-rutherford.patt">
        
        <!-- Загальний контейнер -->
        <a-entity position="0 0.5 0" scale="0.8 0.8 0.8">
          
          <!-- ВІНТАЖНА ОСНОВА (Дерев'яний стіл) -->
          <a-cylinder position="0 -0.5 0" radius="1.2" height="0.1" color="#3e2723" roughness="0.9"></a-cylinder>
          
          <!-- СВИНЦЕВИЙ ВИПРОМІНЮВАЧ (Джерело альфа-частинок) -->
          <a-entity position="-0.8 0.2 0">
             <!-- Свинцевий корпус -->
             <a-cylinder radius="0.2" height="0.4" rotation="0 0 90" color="#4F4F4F" metalness="0.5" roughness="0.7"></a-cylinder>
             <!-- Мідний носик (коліматор) -->
             <a-cylinder position="0.2 0 0" radius="0.05" height="0.1" rotation="0 0 90" color="#b87333" metalness="0.8"></a-cylinder>
          </a-entity>
          
          <!-- ЗОЛОТА ФОЛЬГА В РАМЦІ -->
          <a-entity position="0 0.2 0">
            <!-- Мідна стійка -->
            <a-cylinder position="0 -0.35 0" radius="0.02" height="0.7" color="#b87333" metalness="0.8"></a-cylinder>
            <a-box position="0 -0.7 0" width="0.3" height="0.05" depth="0.2" color="#4e342e"></a-box>
            <!-- Сама золота фольга (напівпрозора, глянцева) -->
            <a-plane position="0 0 0" rotation="0 -90 0" width="0.6" height="0.8" color="#FFD700" metalness="0.9" roughness="0.2" material="side: double; opacity: 0.8; transparent: true"></a-plane>
          </a-entity>

          <!-- АНІМАЦІЯ АЛЬФА-ЧАСТИНОК -->
          <a-entity>
            <!-- Частинка 1: Пролітає прямо наскрізь (як більшість частинок в експерименті) -->
            <a-sphere radius="0.02" color="#FF3300" material="blending: additive" 
                      animation="property: position; from: -0.6 0.2 0; to: 1.0 0.2 0; dur: 1000; loop: true; easing: linear"></a-sphere>
            
            <a-sphere radius="0.02" color="#FF3300" material="blending: additive" 
                      animation="property: position; from: -0.6 0.2 0.05; to: 1.0 0.2 0.05; dur: 900; loop: true; easing: linear; delay: 200"></a-sphere>
            
            <!-- Частинка 2: Відбивається вгору і вбік (зіткнення з ядром) -->
            <a-sphere radius="0.02" color="#FF3300" material="blending: additive" 
                      animation="property: position; from: -0.6 0.2 0.02; to: 0.4 0.8 0.3; dur: 1200; loop: true; easing: linear; delay: 100"
                      animation__fade="property: opacity; from: 1; to: 0; dur: 1200; loop: true"></a-sphere>

            <!-- Частинка 3: Сильно відбивається вниз (рикошет) -->
            <a-sphere radius="0.02" color="#FF3300" material="blending: additive" 
                      animation="property: position; from: -0.6 0.2 -0.05; to: 0.2 -0.3 -0.6; dur: 1100; loop: true; easing: linear; delay: 400"
                      animation__fade="property: opacity; from: 1; to: 0; dur: 1100; loop: true"></a-sphere>
            
            <!-- Частинка 4: Відбивається майже назад до джерела (той самий шокуючий результат) -->
            <a-sphere radius="0.02" color="#FF3300" material="blending: additive" 
                      animation="property: position; from: -0.6 0.2 -0.02; to: -0.3 0.6 0.4; dur: 1500; loop: true; easing: linear; delay: 600"
                      animation__fade="property: opacity; from: 1; to: 0; dur: 1500; loop: true"></a-sphere>
          </a-entity>

          <!-- Вінтажна підкладка (аркуш паперу) під об'єктом -->
          <a-plane position="0 -0.6 0" rotation="-90 0 0" width="3" height="3" color="#F5DEB3" material="opacity: 0.3; transparent: true"></a-plane>

        </a-entity>
      </a-marker>
      
      <!-- Новий маркер Резерфорда (Збільшена в 2 рази) -->
      <a-marker type="pattern" url="./pattern-rutherford-new.patt">
        <a-entity scale="2 2 2" position="0 1.5 0">
          <a-entity>
            <a-sphere position="0 0 0" radius="0.15" color="#FF4500"></a-sphere>
            <a-sphere position="0.05 0.05 0" radius="0.1" color="#DC143C"></a-sphere>
            <a-sphere position="-0.05 -0.05 0" radius="0.1" color="#DC143C"></a-sphere>
          </a-entity>
          <a-entity rotation="0 0 0">
            <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
              <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0" side="double"></a-ring>
              <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
            </a-entity>
          </a-entity>
          <a-entity rotation="30 0 0">
            <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 3200; easing: linear">
              <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0" side="double"></a-ring>
              <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
            </a-entity>
          </a-entity>
          <a-entity rotation="60 0 0">
            <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 3800; easing: linear">
              <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0" side="double"></a-ring>
              <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
            </a-entity>
          </a-entity>
          <a-entity rotation="90 0 0">
            <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 3500; easing: linear">
              <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0" side="double"></a-ring>
              <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
            </a-entity>
          </a-entity>
          <a-entity rotation="120 0 0">
            <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
              <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0" side="double"></a-ring>
              <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
            </a-entity>
          </a-entity>
          <a-entity rotation="150 0 0">
            <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 3100; easing: linear">
              <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0" side="double"></a-ring>
              <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-marker>

      <!-- Спрощений маркер Резерфорда (Збільшена в 2 рази) -->
      <a-marker type="pattern" url="./pattern-rutherford-s.patt">
        <a-entity scale="2 2 2" position="0 1.5 0">
          <a-entity>
            <a-sphere position="0 0 0" radius="0.15" color="#FF4500"></a-sphere>
            <a-sphere position="0.05 0.05 0" radius="0.1" color="#DC143C"></a-sphere>
            <a-sphere position="-0.05 -0.05 0" radius="0.1" color="#DC143C"></a-sphere>
          </a-entity>
          <a-entity rotation="0 0 0">
            <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
              <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0" side="double"></a-ring>
              <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
            </a-entity>
          </a-entity>
          <a-entity rotation="30 0 0">
            <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 3200; easing: linear">
              <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0" side="double"></a-ring>

            <a-sphere radius="0.7" color="#0011FF" material="blending: additive; opacity: 0.05; transparent: true; side: double" animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; dur: 3000; loop: true"></a-sphere>
            <a-entity animation="property: scale; to: 1.1 1 1; dir: alternate; dur: 1200; loop: true">
              <a-sphere position="0.35 0 0" radius="0.18" scale="1.6 1 1" color="#FF00FF" material="blending: additive; opacity: 0.15; transparent: true"></a-sphere>
              <a-sphere position="-0.35 0 0" radius="0.18" scale="1.6 1 1" color="#FF00FF" material="blending: additive; opacity: 0.15; transparent: true"></a-sphere>

            <a-entity animation="property: scale; to: 1 1.1 1; dir: alternate; dur: 1400; loop: true">
              <a-sphere position="0 0.35 0" radius="0.18" scale="1 1.6 1" color="#AA00FF" material="blending: additive; opacity: 0.15; transparent: true"></a-sphere>
              <a-sphere position="0 -0.35 0" radius="0.18" scale="1 1.6 1" color="#AA00FF" material="blending: additive; opacity: 0.15; transparent: true"></a-sphere>

            <a-entity animation="property: scale; to: 1 1 1.1; dir: alternate; dur: 1600; loop: true">

              <a-sphere position="0 0 -0.35" radius="0.18" scale="1 1 1.6" color="#7700FF" material="blending: additive; opacity: 0.15; transparent: true"></a-sphere>
            </a-entity>
          </a-entity>
          <a-entity>
            <a-sphere radius="0.015" color="#FFFFFF" material="blending: additive" animation="property: position; from: 0.2 0.3 0.1; to: -0.3 -0.2 -0.4; dir: alternate; dur: 400; loop: true; easing: easeInOutElastic"></a-sphere>
            <a-sphere radius="0.015" color="#FFFFFF" material="blending: additive" animation="property: position; from: -0.4 0.1 -0.2; to: 0.1 -0.5 0.3; dir: alternate; dur: 550; loop: true; easing: easeInOutElastic"></a-sphere>
            <a-sphere radius="0.015" color="#FFFFFF" material="blending: additive" animation="property: position; from: 0.1 -0.1 0.5; to: -0.2 0.4 -0.1; dir: alternate; dur: 450; loop: true; easing: easeInOutElastic"></a-sphere>

      <a-entity camera></a-entity>
