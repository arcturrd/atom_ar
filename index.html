<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Еволюція моделей атома (AR)</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; patternRatio: 0.90;">
      
      <!-- ========================================== -->
      <!-- 1. МОДЕЛЬ ДАЛЬТОНА (1803)                  -->
      <!-- ========================================== -->
      <a-marker type="pattern" url="./pattern-dalton.patt">
        <a-sphere position="0 0.5 0" radius="0.6" color="#A0522D" roughness="0.8"></a-sphere>
      </a-marker>

      <!-- ========================================== -->
      <!-- 2. МОДЕЛЬ ТОМСОНА (1904)                   -->
      <!-- ========================================== -->
      <a-marker type="pattern" url="./pattern-thomson.patt">
        <a-sphere position="0 0.6 0" radius="0.7" color="#D2691E" opacity="0.6" transparent="true"></a-sphere>
        <a-entity position="0 0.6 0">
          <a-sphere radius="0.1" color="#1E90FF" position="0.3 0.2 0.3" animation="property: position; to: 0.4 0.3 0.4; dir: alternate; dur: 1500; loop: true"></a-sphere>
          <a-sphere radius="0.1" color="#1E90FF" position="-0.4 -0.1 0.2" animation="property: position; to: -0.3 -0.2 0.1; dir: alternate; dur: 2000; loop: true"></a-sphere>
          <a-sphere radius="0.1" color="#1E90FF" position="0.1 -0.4 -0.3" animation="property: position; to: 0.2 -0.3 -0.2; dir: alternate; dur: 1800; loop: true"></a-sphere>
          <a-sphere radius="0.1" color="#1E90FF" position="-0.2 0.4 -0.4" animation="property: position; to: -0.1 0.3 -0.5; dir: alternate; dur: 1700; loop: true"></a-sphere>
        </a-entity>
        <a-text value="J.J. Thomson (1904)" position="-0.8 1.4 0" color="#FFFFFF" rotation="-90 0 0" scale="0.8 0.8 0.8"></a-text>
      </a-marker>

      <!-- ========================================== -->
      <!-- 3. МОДЕЛЬ РЕЗЕРФОРДА (1911) - ОНОВЛЕНА (6 електронів) -->
      <!-- ========================================== -->
      <a-marker type="pattern" url="./pattern-rutherford.patt">
        <a-entity position="0 0.6 0">
          
          <!-- Ядро -->
          <a-entity>
            <a-sphere position="0 0 0" radius="0.15" color="#FF4500"></a-sphere>
            <a-sphere position="0.05 0.05 0" radius="0.1" color="#DC143C"></a-sphere>
            <a-sphere position="-0.05 -0.05 0" radius="0.1" color="#DC143C"></a-sphere>
          </a-entity>

          <!-- Орбіта 1 (Горизонтальна, 0 град) -->
          <a-entity rotation="0 0 0">
            <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
              <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0" side="double"></a-ring>
              <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
            </a-entity>
          </a-entity>

          <!-- Орбіта 2 (Нахил 30 град) -->
          <a-entity rotation="30 0 0">
            <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 3200; easing: linear">
              <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0" side="double"></a-ring>
              <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
            </a-entity>
          </a-entity>

          <!-- Орбіта 3 (Нахил 60 град) -->
          <a-entity rotation="60 0 0">
            <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 3800; easing: linear">
              <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0" side="double"></a-ring>
              <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
            </a-entity>
          </a-entity>

          <!-- Орбіта 4 (Нахил 90 град - Вертикальна) -->
          <a-entity rotation="90 0 0">
            <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 3500; easing: linear">
              <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0" side="double"></a-ring>
              <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
            </a-entity>
          </a-entity>

          <!-- Орбіта 5 (Нахил 120 град) -->
          <a-entity rotation="120 0 0">
            <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
              <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0" side="double"></a-ring>
              <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
            </a-entity>
          </a-entity>

          <!-- Орбіта 6 (Нахил 150 град) -->
          <a-entity rotation="150 0 0">
            <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 3100; easing: linear">
              <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0" side="double"></a-ring>
              <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
            </a-entity>
          </a-entity>

        </a-entity>
      </a-marker>

      <!-- ========================================== -->
      <!-- 4. МОДЕЛЬ БОРА (1913)                      -->
      <!-- ========================================== -->
      <a-marker type="pattern" url="./pattern-bohr.patt">
        <a-entity position="0 0.6 0" rotation="35 0 0">
          <a-entity>
            <a-sphere position="0 0 0" radius="0.12" color="#FF4500"></a-sphere>
            <a-sphere position="0.04 0.04 0" radius="0.08" color="#DC143C"></a-sphere>
            <a-sphere position="-0.04 -0.04 0" radius="0.08" color="#DC143C"></a-sphere>
          </a-entity>
          <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 2500; easing: linear">
            <a-ring radius-inner="0.38" radius-outer="0.4" color="#FFFFFF" opacity="0.6" rotation="90 0 0" side="double"></a-ring>
            <a-sphere position="0.4 0 0" radius="0.06" color="#00FF00"></a-sphere>
            <a-sphere position="-0.4 0 0" radius="0.06" color="#00FF00"></a-sphere>
          </a-entity>
          <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 4500; easing: linear">
            <a-ring radius-inner="0.68" radius-outer="0.7" color="#FFFFFF" opacity="0.6" rotation="90 0 0" side="double"></a-ring>
            <a-sphere position="0.7 0 0" radius="0.06" color="#00FF00"></a-sphere>
            <a-sphere position="-0.7 0 0" radius="0.06" color="#00FF00"></a-sphere>
            <a-sphere position="0 0 0.7" radius="0.06" color="#00FF00"></a-sphere>
            <a-sphere position="0 0 -0.7" radius="0.06" color="#00FF00"></a-sphere>
          </a-entity>
          <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
            <a-ring radius-inner="0.98" radius-outer="1.0" color="#FFFFFF" opacity="0.6" rotation="90 0 0" side="double"></a-ring>
            <a-sphere position="1.0 0 0" radius="0.06" color="#00FF00"></a-sphere>
            <a-sphere position="-1.0 0 0" radius="0.06" color="#00FF00"></a-sphere>
          </a-entity>
          <a-sphere radius="0.04" color="#FFD700"
                    animation="property: position; from: 0.7 0 0; to: 2 0 1.5; loop: true; dur: 2000"
                    animation__fade="property: opacity; from: 1; to: 0; loop: true; dur: 2000">
          </a-sphere>
        </a-entity>
        <a-text value="Niels Bohr (1913)" position="-0.8 1.5 -0.5" color="#FFFFFF" rotation="-90 0 0" scale="0.8 0.8 0.8"></a-text>
      </a-marker>

      <!-- ========================================== -->
      <!-- 5. МОДЕЛЬ ШРЕДІНГЕРА (1926) - КВАНТОВА ХМАРА -->
      <!-- ========================================== -->
      <a-marker type="pattern" url="./pattern-schrodinger.patt">
        
        <!-- Загальний контейнер -->
        <a-entity position="0 0.7 0">
          
          <!-- ДИНАМІЧНЕ ЯДРО: Щільне скупчення протонів/нейтронів, що злегка вібрує -->
          <a-entity animation="property: position; to: 0 0.01 0; dir: alternate; dur: 150; loop: true; easing: easeInOutSine">
            <a-sphere position="0 0 0" radius="0.07" color="#FF3300"></a-sphere>
            <a-sphere position="0.05 0.04 0.02" radius="0.05" color="#DC143C"></a-sphere>
            <a-sphere position="-0.04 -0.05 0.03" radius="0.05" color="#696969"></a-sphere>
            <a-sphere position="0.04 -0.04 -0.04" radius="0.05" color="#DC143C"></a-sphere>
            <a-sphere position="-0.05 0.03 -0.03" radius="0.05" color="#696969"></a-sphere>
            <a-sphere position="0 0.06 -0.02" radius="0.05" color="#696969"></a-sphere>
            <a-sphere position="-0.02 0.01 0.06" radius="0.05" color="#DC143C"></a-sphere>
          </a-entity>

          <!-- КВАНТОВІ ОРБІТАЛІ (Електронна хмара) -->
          <!-- Повільне 3D-обертання всієї хмари для демонстрації об'єму -->
          <a-entity animation="property: rotation; to: 360 720 180; loop: true; dur: 25000; easing: linear">
            
            <!-- S-ОРБІТАЛІ (Сферична хмара ймовірності - 3 рівні густини) -->
            <!-- additive blending створює ефект світіння та накладання енергії -->
            <a-sphere radius="0.25" color="#00FFFF" material="blending: additive; opacity: 0.25; transparent: true; side: double"
                      animation="property: scale; to: 1.05 1.05 1.05; dir: alternate; dur: 800; loop: true"></a-sphere>
            <a-sphere radius="0.45" color="#0088FF" material="blending: additive; opacity: 0.15; transparent: true; side: double"
                      animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 1500; loop: true"></a-sphere>
            <a-sphere radius="0.7" color="#0011FF" material="blending: additive; opacity: 0.05; transparent: true; side: double"
                      animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; dur: 3000; loop: true"></a-sphere>

            <!-- P-ОРБІТАЛІ (Гантелеподібні хмари по 3 осях) -->
            <!-- Вісь X (px-орбіталь) -->
            <a-entity animation="property: scale; to: 1.1 1 1; dir: alternate; dur: 1200; loop: true">
              <a-sphere position="0.35 0 0" radius="0.18" scale="1.6 1 1" color="#FF00FF" material="blending: additive; opacity: 0.15; transparent: true"></a-sphere>
              <a-sphere position="-0.35 0 0" radius="0.18" scale="1.6 1 1" color="#FF00FF" material="blending: additive; opacity: 0.15; transparent: true"></a-sphere>
            </a-entity>

            <!-- Вісь Y (py-орбіталь) -->
            <a-entity animation="property: scale; to: 1 1.1 1; dir: alternate; dur: 1400; loop: true">
              <a-sphere position="0 0.35 0" radius="0.18" scale="1 1.6 1" color="#AA00FF" material="blending: additive; opacity: 0.15; transparent: true"></a-sphere>
              <a-sphere position="0 -0.35 0" radius="0.18" scale="1 1.6 1" color="#AA00FF" material="blending: additive; opacity: 0.15; transparent: true"></a-sphere>
            </a-entity>

            <!-- Вісь Z (pz-орбіталь) -->
            <a-entity animation="property: scale; to: 1 1 1.1; dir: alternate; dur: 1600; loop: true">
              <a-sphere position="0 0 0.35" radius="0.18" scale="1 1 1.6" color="#7700FF" material="blending: additive; opacity: 0.15; transparent: true"></a-sphere>
              <a-sphere position="0 0 -0.35" radius="0.18" scale="1 1 1.6" color="#7700FF" material="blending: additive; opacity: 0.15; transparent: true"></a-sphere>
            </a-entity>
            
          </a-entity>

          <!-- ЕФЕКТ МИТТЄВИХ ПОЛОЖЕНЬ ЕЛЕКТРОНА -->
          <!-- Білі енергетичні точки, що дуже швидко хаотично стрибають всередині хмари -->
          <a-entity>
            <a-sphere radius="0.015" color="#FFFFFF" material="blending: additive" 
                      animation="property: position; from: 0.2 0.3 0.1; to: -0.3 -0.2 -0.4; dir: alternate; dur: 400; loop: true; easing: easeInOutElastic"></a-sphere>
            <a-sphere radius="0.015" color="#FFFFFF" material="blending: additive" 
                      animation="property: position; from: -0.4 0.1 -0.2; to: 0.1 -0.5 0.3; dir: alternate; dur: 550; loop: true; easing: easeInOutElastic"></a-sphere>
            <a-sphere radius="0.015" color="#FFFFFF" material="blending: additive" 
                      animation="property: position; from: 0.1 -0.1 0.5; to: -0.2 0.4 -0.1; dir: alternate; dur: 450; loop: true; easing: easeInOutElastic"></a-sphere>
          </a-entity>
          
        </a-entity>
        
      </a-marker>
      
      <!-- Камера -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
