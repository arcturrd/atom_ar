<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Модель атома Джона Дальтона (AR)</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Змінений блок: підключення власного маркера -->
      <a-marker type="pattern" url="pattern-dalton.patt">
        
        <!-- 3D-Модель атома Дальтона -->
        <a-sphere position="0 0.5 0" radius="0.8" color="#A0522D" roughness="0.8"></a-sphere>
        
        <!-- Підпис -->
        <a-text value="John Dalton (1803)" position="-1 1.5 0" color="#333333" rotation="-90 0 0"></a-text>
        
      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
