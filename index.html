<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Моделі атомів (AR)</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <!-- AR-сцена -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; patternRatio: 0.90;">
      
      <!-- ========================================== -->
      <!-- 1. МОДЕЛЬ ДАЛЬТОНА (1803)                  -->
      <!-- ========================================== -->
      <a-marker type="pattern" url="./pattern-dalton.patt">
        <a-sphere position="0 0.5 0" radius="0.6" color="#A0522D" roughness="0.8"></a-sphere>
        <a-text value="John Dalton (1803)" position="-0.8 1.2 0" color="#FFFFFF" rotation="-90 0 0" scale="0.8 0.8 0.8"></a-text>
      </a-marker>

      <!-- ========================================== -->
      <!-- 2. МОДЕЛЬ ТОМСОНА (1904)                   -->
      <!-- ========================================== -->
      <a-marker type="pattern" url="./pattern-thomson.patt">
        <a-sphere position="0 0.6 0" radius="0.7" color="#D2691E" opacity="0.6" transparent="true"></a-sphere>
        <a-entity position="0 0.6 0">
          <a-sphere radius="0.1" color="#1E90FF" position="0.3 0.2 0.3"><a-animation attribute="position" to="0.4 0.3 0.4" direction="alternate" dur="1500" repeat="indefinite"></a-animation></a-sphere>
          <a-sphere radius="0.1" color="#1E90FF" position="-0.4 -0.1 0.2"><a-animation attribute="position" to="-0.3 -0.2 0.1" direction="alternate" dur="2000" repeat="indefinite"></a-animation></a-sphere>
          <a-sphere radius="0.1" color="#1E90FF" position="0.1 -0.4 -0.3"><a-animation attribute="position" to="0.2 -0.3 -0.2" direction="alternate" dur="1800" repeat="indefinite"></a-animation></a-sphere>
          <a-sphere radius="0.1" color="#1E90FF" position="-0.2 0.4 -0.4"><a-animation attribute="position" to="-0.1 0.3 -0.5" direction="alternate" dur="1700" repeat="indefinite"></a-animation></a-sphere>
        </a-entity>
        <a-text value="J.J. Thomson (1904)" position="-0.8 1.4 0" color="#FFFFFF" rotation="-90 0 0" scale="0.8 0.8 0.8"></a-text>
      </a-marker>

      <!-- ========================================== -->
      <!-- 3. МОДЕЛЬ РЕЗЕРФОРДА (1911)                -->
      <!-- ========================================== -->
      <a-marker type="pattern" url="./pattern-rutherford.patt">
        
        <!-- Загальний контейнер моделі Резерфорда (щоб підняти всю модель над маркером) -->
        <a-entity position="0 0.6 0">
          
          <!-- Центральне масивне позитивне ядро (скупчення частинок) -->
          <a-entity>
            <a-sphere position="0 0 0" radius="0.15" color="#FF4500"></a-sphere>
            <!-- Імітація кількох протонів у ядрі -->
            <a-sphere position="0.05 0.05 0" radius="0.1" color="#DC143C"></a-sphere>
            <a-sphere position="-0.05 -0.05 0" radius="0.1" color="#DC143C"></a-sphere>
          </a-entity>

          <!-- Орбіта 1 (Горизонтальна) -->
          <a-entity>
            <!-- Анімація обертання всієї орбіти навколо осі Y -->
            <a-animation attribute="rotation" to="0 360 0" dur="3000" easing="linear" repeat="indefinite"></a-animation>
            <!-- Візуалізація лінії орбіти (кільце) -->
            <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0"></a-ring>
            <!-- Електрон на цій орбіті -->
            <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
          </a-entity>

          <!-- Орбіта 2 (Нахилена під кутом 60 градусів по X) -->
          <a-entity rotation="60 0 0">
            <a-animation attribute="rotation" to="60 360 0" dur="4000" easing="linear" repeat="indefinite"></a-animation>
            <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0"></a-ring>
            <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
          </a-entity>

          <!-- Орбіта 3 (Нахилена під кутом 120 градусів по X) -->
          <a-entity rotation="120 0 0">
            <a-animation attribute="rotation" to="120 360 0" dur="3500" easing="linear" repeat="indefinite"></a-animation>
            <a-ring radius-inner="0.68" radius-outer="0.7" color="#555555" rotation="90 0 0"></a-ring>
            <a-sphere position="0.7 0 0" radius="0.08" color="#1E90FF"></a-sphere>
          </a-entity>
          
        </a-entity>

        <!-- Підпис над моделлю -->
        <a-text value="E. Rutherford (1911)" position="-0.8 1.4 0" color="#FFFFFF" rotation="-90 0 0" scale="0.8 0.8 0.8"></a-text>

      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
