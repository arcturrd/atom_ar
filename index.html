<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Модель атома Джона Дальтона (AR)</title>
    <!-- Підключення стабільних версій A-Frame та AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- Додано параметр patternRatio та підвищено точність розпізнавання -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; patternRatio: 0.50;">
      
      <!-- Вказано явний відносний шлях ./pattern-dalton.patt -->
      <a-marker type="pattern" url="./pattern-dalton.patt.txt">
        
        <!-- 3D-Модель атома Дальтона -->
        <a-sphere position="0 0.5 0" radius="0.6" color="#A0522D" roughness="0.8"></a-sphere>
        
        <!-- Підпис над моделлю -->
        <a-text value="John Dalton (1803)" position="-0.8 1.2 0" color="#FFFFFF" rotation="-90 0 0" scale="0.8 0.8 0.8"></a-text>
        
      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
