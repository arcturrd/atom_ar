<!DOCTYPE html>

    <title>Еволюція моделей атома (AR)</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
    <script>
  AFRAME.registerComponent('soundhandler', {
    init: function () {
      this.soundEl = this.el.querySelector('.ambient-sound');
      this.el.addEventListener('markerFound', () => {
        if (this.soundEl) this.soundEl.components.sound.playSound();
      });
      this.el.addEventListener('markerLost', () => {
        if (this.soundEl) this.soundEl.components.sound.pauseSound();
      });
    }
  });
</script>

      <a-assets>
  <!-- Звук кабінету 19 століття (цокання, скрип) -->
  <audio id="dalton-audio" src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_82c694a919.mp3" preload="auto" loop></audio>
  <!-- Шрифт із підтримкою кирилиці -->
  <a-asset-item id="cyrillic-font" src="https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/ptsans/PTSans-Bold.json"></a-asset-item>
</a-assets>

      <!-- Коромисло (з анімацією гойдання) -->

        <!-- Ліва шалька (Атом Дальтона) -->

          <a-sphere position="0 0.25 0" radius="0.2" color="#8B0000" roughness="0.9"></a-sphere>
        </a-entity>
        
        <!-- Права шалька (Гирьки) -->
